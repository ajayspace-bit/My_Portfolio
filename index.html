<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajay S | AI Engineer</title>
  <link rel="icon" type="image/jpeg" href="assets/images/profile.jpg">
  <meta name="description" content="AI Engineer | Generative AI | Machine Learning | Full Stack AI Developer">
  <meta name="author" content="Ajay S">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://my-portfolio-pzdz4fau7-ajay-space.vercel.app/">
  <meta property="og:title" content="Ajay S | AI Engineer">
  <meta property="og:description" content="Building Intelligent AI Systems That Transform Data Into Real-World Impact.">
  <meta property="og:image" content="https://my-portfolio-pzdz4fau7-ajay-space.vercel.app/assets/images/profile.jpg">
  <meta property="og:image:type" content="image/jpeg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="https://my-portfolio-pzdz4fau7-ajay-space.vercel.app/">
  <meta name="twitter:title" content="Ajay S | AI Engineer">
  <meta name="twitter:description" content="AI Engineer | Generative AI | Machine Learning">
  <meta name="twitter:image" content="https://my-portfolio-pzdz4fau7-ajay-space.vercel.app/assets/images/profile.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <!-- ============ NAVBAR ============ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="#home" class="logo" id="navLogo"></a>
      <ul class="nav-links" id="navLinks">
        <!-- Rendered by JS -->
      </ul>
      <div class="nav-cta">
        <a href="assets/resume.pdf" class="btn btn-primary" id="navResume" download>Resume</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <!-- ============ HERO ============ -->
  <section class="hero" id="home">
    <div class="hero-container">
      <div class="hero-layout"
        style="display: flex; align-items: center; justify-content: center; gap: 48px; flex-wrap: wrap; width: 100%;">
        <div class="hero-inner" style="text-align: center; max-width: 800px; flex: 1; min-width: 320px; display: flex; flex-direction: column; align-items: center;">

          <!-- Top Badge -->
          <div class="hero-badge" id="heroBadge"
            style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 100px; background: rgba(91,155,213,0.1); border: 1px solid rgba(91,155,213,0.25); font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 28px;">
            <span
              style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite;"></span>
            <span id="heroBadgeText"></span>
          </div>

          <h1 id="heroHeading"
            style="text-align: center; font-size: clamp(38px, 5.5vw, 56px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 24px;">
          </h1>

          <div class="hero-desc-container"
            style="max-width: 720px; margin-bottom: 36px; display: flex; flex-direction: column; gap: 16px; text-align: center;">
            <p class="lede" id="heroDesc"
              style="margin: 0; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.6; color: var(--text-dark-heading);">
            </p>
            <p class="lede" id="heroSubDesc"
              style="margin: 0; font-size: clamp(14px, 1.4vw, 17px); line-height: 1.6; color: var(--text-dark-muted); opacity: 0.95;">
            </p>
          </div>

          <div class="hero-actions"
            style="justify-content: center; margin-bottom: 0; display: flex; gap: 16px; flex-wrap: wrap;"
            id="heroActions">
            <!-- Rendered by JS -->
          </div>

        </div>
        <div class="hero-image-wrapper" id="heroImageWrapper"></div>
      </div>
    </div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section class="light-section" id="about">
    <div class="container">
      <div class="section-head reveal">
        <div class="eyebrow" id="aboutEyebrow"></div>
        <h2 id="aboutHeading"></h2>
      </div>
      <p class="about-intro reveal" id="aboutIntro"></p>

      <div class="about-grid" id="aboutGrid">
        <!-- Rendered by JS -->
      </div>

      <div class="edu-card reveal" id="eduCard">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ============ SKILLS ============ -->
  <section class="dark-section" id="skills">
    <div class="container">
      <div class="section-head reveal">
        <div class="eyebrow" id="skillsEyebrow"></div>
        <h2 id="skillsHeading"></h2>
      </div>

      <div class="skills-grid" id="skillsGrid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ============ PROJECTS ============ -->
  <section class="light-section" id="projects">
    <div class="container">
      <div class="section-head reveal">
        <div class="eyebrow" id="projectsEyebrow"></div>
        <h2 id="projectsHeading"></h2>
      </div>

      <div class="projects-grid" id="projectsGrid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ============ SERVICES ============ -->
  <section class="dark-section" id="services">
    <div class="container">
      <div class="section-head reveal">
        <div class="eyebrow" id="servicesEyebrow"></div>
        <h2 id="servicesHeading"></h2>
      </div>

      <div class="services-grid" id="servicesGrid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ============ EXPERIENCE ============ -->
  <section class="light-section" id="experience">
    <div class="container">
      <div class="section-head reveal">
        <div class="eyebrow" id="expEyebrow"></div>
        <h2 id="expHeading"></h2>
      </div>

      <div class="timeline" id="expTimeline">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="dark-section" id="contact" style="text-align: center;">
    <div class="container">
      <div class="section-head reveal" style="margin: 0 auto 48px; max-width: 800px;">
        <div class="eyebrow" id="contactEyebrow" style="justify-content: center;"></div>
        <h2 id="contactHeadingEl"
          style="font-family: var(--font-sans); font-size: clamp(36px, 5vw, 56px); font-weight: 900; color: var(--text-dark-heading); letter-spacing: -0.03em; margin-top: 16px;">
        </h2>
      </div>

      <div class="reveal" style="max-width: 600px; margin: 0 auto;">
        <div class="contact-info-card" id="contactInfoCard" style="text-align: left; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
          <!-- Rendered by JS -->
        </div>

        <p id="socialLabel"
          style="margin-top: 48px; font-size: 14px; font-weight: 600; color: var(--text-dark-muted); letter-spacing: 0.1em; text-transform: uppercase;">
        </p>
        <div class="social-row" style="margin-top: 20px; justify-content: center; gap: 16px;" id="socialRow">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </section>



  <button class="to-top" id="toTop" aria-label="Scroll to top"><i class="fa-solid fa-arrow-up"></i></button>
  <script src="script.js?v=2"></script>

</body>

</html>
