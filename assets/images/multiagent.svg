<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0EA5E9"/>
  <!-- Multi-agent: 3 nodes connected in a triangle with hub -->
  <!-- Central hub -->
  <circle cx="50" cy="50" r="10" fill="white"/>
  <!-- Agent nodes -->
  <circle cx="50" cy="20" r="9" fill="white" opacity="0.9"/>
  <circle cx="22" cy="68" r="9" fill="white" opacity="0.9"/>
  <circle cx="78" cy="68" r="9" fill="white" opacity="0.9"/>
  <!-- Connection lines to center -->
  <line x1="50" y1="29" x2="50" y2="40" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="29" y1="62" x2="42" y2="55" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="71" y1="62" x2="58" y2="55" stroke="white" stroke-width="3" opacity="0.8"/>
  <!-- Agent to agent (triangle) -->
  <line x1="57" y1="24" x2="71" y2="62" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="43" y1="24" x2="29" y2="62" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="31" y1="68" x2="69" y2="68" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- "M" label in center -->
  <text x="50" y="54" text-anchor="middle" fill="#0EA5E9" font-size="10" font-family="Arial" font-weight="bold">M</text>
</svg>
