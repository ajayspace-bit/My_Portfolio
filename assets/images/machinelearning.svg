<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#6366F1"/>
  <!-- Machine Learning: neural network layers -->
  <!-- Input layer -->
  <circle cx="18" cy="30" r="7" fill="white" opacity="0.9"/>
  <circle cx="18" cy="50" r="7" fill="white" opacity="0.9"/>
  <circle cx="18" cy="70" r="7" fill="white" opacity="0.9"/>
  <!-- Hidden layer -->
  <circle cx="50" cy="22" r="7" fill="white" opacity="0.9"/>
  <circle cx="50" cy="42" r="7" fill="white" opacity="0.9"/>
  <circle cx="50" cy="62" r="7" fill="white" opacity="0.9"/>
  <circle cx="50" cy="80" r="7" fill="white" opacity="0.9"/>
  <!-- Output layer -->
  <circle cx="82" cy="38" r="7" fill="white" opacity="0.9"/>
  <circle cx="82" cy="62" r="7" fill="white" opacity="0.9"/>
  <!-- Connections input → hidden -->
  <line x1="25" y1="30" x2="43" y2="22" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="30" x2="43" y2="42" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="50" x2="43" y2="42" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="50" x2="43" y2="62" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="70" x2="43" y2="62" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="70" x2="43" y2="80" stroke="white" stroke-width="1" opacity="0.4"/>
  <!-- Connections hidden → output -->
  <line x1="57" y1="22" x2="75" y2="38" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="57" y1="42" x2="75" y2="38" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="57" y1="62" x2="75" y2="62" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="57" y1="80" x2="75" y2="62" stroke="white" stroke-width="1" opacity="0.4"/>
</svg>
