<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#4F46E5"/>
  <!-- API Integration: two systems connected by arrow with plug -->
  <!-- Left system box -->
  <rect x="8" y="28" width="28" height="44" rx="6" fill="white" opacity="0.2" stroke="white" stroke-width="2"/>
  <rect x="12" y="34" width="20" height="4" rx="2" fill="white" opacity="0.8"/>
  <rect x="12" y="42" width="20" height="4" rx="2" fill="white" opacity="0.8"/>
  <rect x="12" y="50" width="14" height="4" rx="2" fill="white" opacity="0.8"/>
  <!-- Right system box -->
  <rect x="64" y="28" width="28" height="44" rx="6" fill="white" opacity="0.2" stroke="white" stroke-width="2"/>
  <rect x="68" y="34" width="20" height="4" rx="2" fill="white" opacity="0.8"/>
  <rect x="68" y="42" width="20" height="4" rx="2" fill="white" opacity="0.8"/>
  <rect x="68" y="50" width="14" height="4" rx="2" fill="white" opacity="0.8"/>
  <!-- Arrow connector with API label -->
  <line x1="36" y1="50" x2="64" y2="50" stroke="white" stroke-width="3"/>
  <polygon points="60,44 68,50 60,56" fill="white"/>
  <!-- API text bubble -->
  <rect x="38" y="38" width="24" height="14" rx="4" fill="white"/>
  <text x="50" y="49" text-anchor="middle" fill="#4F46E5" font-size="9" font-family="Arial" font-weight="bold">API</text>
</svg>
