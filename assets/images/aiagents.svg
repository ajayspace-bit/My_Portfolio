<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#3B82F6"/>
  <!-- AI Agent: robot head -->
  <!-- Head -->
  <rect x="28" y="22" width="44" height="40" rx="8" fill="white"/>
  <!-- Eyes (screen) -->
  <rect x="34" y="30" width="13" height="10" rx="3" fill="#3B82F6"/>
  <rect x="53" y="30" width="13" height="10" rx="3" fill="#3B82F6"/>
  <!-- Antenna -->
  <line x1="50" y1="22" x2="50" y2="12" stroke="white" stroke-width="3"/>
  <circle cx="50" cy="10" r="4" fill="white"/>
  <!-- Mouth/smile line -->
  <rect x="36" y="48" width="28" height="5" rx="2.5" fill="#3B82F6"/>
  <!-- Body -->
  <rect x="34" y="64" width="32" height="22" rx="6" fill="white" opacity="0.85"/>
  <!-- Arm connections -->
  <rect x="18" y="66" width="14" height="8" rx="4" fill="white" opacity="0.8"/>
  <rect x="68" y="66" width="14" height="8" rx="4" fill="white" opacity="0.8"/>
</svg>
