<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#7C3AED"/>
  <!-- MCP: hexagon with circuit/protocol lines -->
  <polygon points="50,12 76,27 76,57 50,72 24,57 24,27" fill="none" stroke="white" stroke-width="4"/>
  <!-- Inner circle -->
  <circle cx="50" cy="42" r="12" fill="white" opacity="0.9"/>
  <!-- Connection dots -->
  <circle cx="50" cy="12" r="4" fill="white"/>
  <circle cx="76" cy="27" r="4" fill="white"/>
  <circle cx="76" cy="57" r="4" fill="white"/>
  <circle cx="50" cy="72" r="4" fill="white"/>
  <circle cx="24" cy="57" r="4" fill="white"/>
  <circle cx="24" cy="27" r="4" fill="white"/>
  <!-- Text: MCP -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-size="12" font-family="Arial" font-weight="bold">MCP</text>
</svg>
