<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#06B6D4"/>
  <!-- Embeddings: vector space dots connected with arrows -->
  <!-- Grid dots -->
  <circle cx="22" cy="25" r="5" fill="white" opacity="0.9"/>
  <circle cx="45" cy="18" r="5" fill="white" opacity="0.9"/>
  <circle cx="70" cy="30" r="5" fill="white" opacity="0.9"/>
  <circle cx="30" cy="50" r="5" fill="white" opacity="0.9"/>
  <circle cx="58" cy="52" r="5" fill="white" opacity="0.9"/>
  <circle cx="80" cy="60" r="5" fill="white" opacity="0.9"/>
  <circle cx="20" cy="74" r="5" fill="white" opacity="0.9"/>
  <circle cx="48" cy="80" r="5" fill="white" opacity="0.9"/>
  <circle cx="75" cy="82" r="5" fill="white" opacity="0.9"/>
  <!-- Connection lines -->
  <line x1="22" y1="25" x2="45" y2="18" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="45" y1="18" x2="70" y2="30" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="22" y1="25" x2="30" y2="50" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="45" y1="18" x2="58" y2="52" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="70" y1="30" x2="80" y2="60" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="50" x2="48" y2="80" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="58" y1="52" x2="75" y2="82" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Arrow indicator -->
  <path d="M10 50 L90 50" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3"/>
  <path d="M50 10 L50 90" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3"/>
</svg>
